<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prévia — DEMONIAKA PainelTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Metal Mania';
    src: url('fonte-demoniaka.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; width: 100%; }
  body {
    font-family: "Segoe UI", "Inter", Arial, sans-serif;
    background:
      radial-gradient(ellipse at 30% 20%, #2b3a4a 0%, transparent 55%),
      radial-gradient(ellipse at 75% 80%, #1e3b2a 0%, transparent 50%),
      linear-gradient(180deg, #14202c 0%, #0d141c 60%, #0a0f14 100%);
    overflow: hidden;
    color: #fff;
  }

  /* ===== botão flutuante TP ===== */
  #toggle {
    position: absolute; left: 20px; top: 50%; margin-top: -180px;
    width: 50px; height: 50px; border-radius: 25px;
    background: #232328; color: #fff; border: 1px solid rgba(255,255,255,0.25);
    font-weight: 700; font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.6);
    transition: transform .1s, background .15s;
    font-family: 'Metal Mania', cursive, sans-serif;
    display: flex; align-items: center; justify-content: center;
    background-size: cover; background-position: center;
    z-index: 999;
  }
  #toggle:hover { background-color: #2e2e34; transform: scale(1.05); }
  #toggle:active { cursor: grabbing; }

  /* ===== painel ===== */
  #painel {
    position: absolute; left: 90px; top: 50%; margin-top: -233px;
    width: 320px; height: 526px;
    background: #18181c; border-radius: 10px;
    box-shadow: 0 12px 45px rgba(0,0,0,.75);
    overflow: hidden; display: none;
    font-family: 'Metal Mania', cursive, sans-serif;
    border: 1px solid rgba(255,255,255,0.12);
    z-index: 1000;
  }
  #painel.aberto { display: block; }
  #painel.minimizado { height: 34px !important; }
  #fundoPainel {
    position: absolute; inset: 0; border-radius: 10px;
    background-size: cover; background-position: center;
  }
  #sombraFundo {
    position: absolute; inset: 0; border-radius: 10px;
    background: rgba(0,0,0,.08);
  }

  #painel button, #painel input {
    font-family: inherit;
  }

  /* cabeçalho */
  #arraste {
    position: absolute; left: 0; top: 0; width: 100%; height: 34px;
    cursor: grab;
  }
  #titulo {
    position: absolute; left: 8px; top: 0; height: 32px; width: calc(100% - 70px);
    display: flex; align-items: center;
    font-weight: 700; font-size: 16px;
  }
  #minimizar {
    position: absolute; right: 38px; top: 4px; width: 26px; height: 26px;
    border: 1px solid rgba(255,255,255,.45); border-radius: 13px; background: transparent;
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 1px #000;
    transition: background .15s;
  }
  #minimizar:hover { background: rgba(255,255,255,.15); }
  #fechar {
    position: absolute; right: 6px; top: 4px; width: 26px; height: 26px;
    border: 1px solid rgba(255,120,120,.7); border-radius: 13px; background: transparent;
    color: rgb(255,120,120); font-weight: 700; font-size: 14px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 1px #000;
    transition: background .15s;
  }
  #fechar:hover { background: rgba(255,50,50,.2); }
  #logoCabecalho { height: 30px; margin-top: 1px; display: block; cursor: pointer; }

  /* botões genéricos: SEM FUNDO para a mulher 2D ficar totalmente à mostra */
  .botao {
    position: absolute; border: 1px solid rgba(255,255,255,.45); border-radius: 6px;
    background: transparent; color: #fff;
    font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
    transition: filter .12s, border-color .15s;
  }
  .botao:hover { filter: brightness(1.3); border-color: rgba(255,255,255,.8); }
  .on   { color: #5aff96 !important; border-color: rgba(90,255,150,.85) !important; text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 2px #000 !important; }
  .azul { color: #fff !important; border-color: rgba(255,255,255,.85) !important; }
  .vermelho { color: #ff7878 !important; border-color: rgba(255,120,120,.85) !important; }

  /* linha 1: Noclip / ESP / Anti-Cair */
  .toolbar { top: 42px; width: 96px; height: 28px; font-size: 11px; }
  .toolbar.b1 { left: 8px; }
  .toolbar.b2 { left: 112px; }
  .toolbar.b3 { left: 216px; }

  /* linha 2: Salvar / Retornar */
  .locais { top: 78px; width: 148px; height: 28px; }
  .locais.esq { left: 8px; }
  .locais.dir { left: 164px; color: rgb(180,180,185); }

  /* MOVIMENTO */
  #labelMov {
    position: absolute; left: 8px; top: 116px; height: 14px;
    font-size: 12px; font-weight: 700; color: #fff;
    letter-spacing: .5px;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  .linhaMov {
    position: absolute; left: 8px; width: 304px; height: 26px;
    background: transparent; border-radius: 6px;
  }
  .linhaMov .lbl {
    position: absolute; left: 8px; top: 0; width: 70px; height: 100%;
    display: flex; align-items: center; font-size: 12px;
    white-space: nowrap; overflow: hidden;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  .linhaMov .btnMax {
    position: absolute; left: 82px; top: 3px; width: 32px; height: 20px;
    border: 1px solid rgba(255,255,255,.45); border-radius: 6px; background: transparent;
    color: #fff; font-weight: 700; font-size: 11px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  .linhaMov .btnMax:hover { filter: brightness(1.3); }
  .linhaMov .btnNormal {
    position: absolute; left: 118px; top: 3px; width: 42px; height: 20px;
    border: 1px solid rgba(255,255,255,.45); border-radius: 6px; background: transparent;
    color: #fff; font-weight: 700; font-size: 10px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  .linhaMov .btnNormal:hover { filter: brightness(1.3); }
  .linhaMov .btnMenos, .linhaMov .btnMais {
    position: absolute; top: 3px; width: 24px; height: 20px;
    border: 1px solid rgba(255,255,255,.45); border-radius: 6px; background: transparent;
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  .linhaMov .btnMenos:hover, .linhaMov .btnMais:hover { filter: brightness(1.3); }
  .linhaMov .btnMenos { left: 200px; }
  .linhaMov .btnMais  { left: 276px; }
  .linhaMov .valor {
    position: absolute; left: 228px; width: 44px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  #flyToggle {
    position: absolute; left: 164px; top: 3px; width: 28px; height: 20px;
    border: 1px solid rgba(255,255,255,.45); border-radius: 5px; background: transparent;
    color: #fff; font-weight: 700; font-size: 10px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  #flyToggle.on {
    color: #5aff96 !important;
    border-color: rgba(90,255,150,.85) !important;
  }

  /* busca */
  #busca {
    position: absolute; left: 8px; top: 230px; width: 304px; height: 28px;
    background: transparent; border: 1px solid rgba(255,255,255,0.45); border-radius: 6px;
    color: #fff; font-family: inherit; font-size: 13px;
    padding-left: 10px; outline: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  #busca::placeholder { color: rgb(170,170,175); }

  /* barra espectando */
  #barraEspectando {
    position: absolute; left: 8px; top: 266px; width: 304px; height: 28px;
    background: transparent; border: 1px solid rgba(255,255,255,0.45);
    border-radius: 6px; display: none; align-items: center; padding: 0 8px; gap: 8px;
  }
  #barraEspectando.visivel { display: flex; }
  #statusDot {
    width: 8px; height: 8px; border-radius: 4px; background: #ff2222;
    box-shadow: 0 0 8px #ff2222; animation: blinkDot 0.8s infinite alternate;
  }
  @keyframes blinkDot {
    from { opacity: 0.3; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1.2); }
  }
  #labelEspectando {
    flex: 1; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  #btnPararSpec {
    width: 60px; height: 20px; border-radius: 5px; border: 1px solid rgba(255,100,100,.7);
    background: transparent; color: rgb(255,120,120); font-size: 11px; cursor: pointer;
    font-weight: 700; transition: background 0.15s; font-family: inherit;
    text-shadow: 0 1px 2px rgba(0,0,0,.95);
  }
  #btnPararSpec:hover { background: rgba(255,50,50,.2); }

  /* lista de jogadores */
  #lista {
    position: absolute; left: 8px; top: 266px;
    width: 304px; height: 252px;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 6px;
    padding-right: 4px;
    scrollbar-width: thin; scrollbar-color: #5a5a5f transparent;
  }
  #lista::-webkit-scrollbar { width: 5px; }
  #lista::-webkit-scrollbar-thumb { background: #5a5a5f; border-radius: 3px; }

  .card {
    flex: 0 0 78px; background: transparent; border-radius: 8px; position: relative;
    border: 1px solid rgba(255,255,255,0.35);
  }
  .foto {
    position: absolute; left: 6px; top: 6px; width: 40px; height: 40px;
    border-radius: 6px; background: rgba(50, 50, 55, 0.7);
    border: 1px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif !important;
    font-weight: 700; font-size: 16px; color: #cfcfd4;
    overflow: hidden;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .nome {
    position: absolute; left: 54px; top: 6px; height: 40px; width: calc(100% - 90px);
    display: flex; align-items: center; font-weight: 700; font-size: 16px;
    letter-spacing: 0.5px;
    white-space: nowrap; overflow: hidden;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 1px #000;
  }
  .estrela {
    position: absolute; right: 6px; top: 8px; width: 26px; height: 26px;
    background: none; border: none; cursor: pointer;
    font-family: Arial, sans-serif !important;
    font-size: 20px; font-weight: 700; color: rgb(180,180,185);
    text-shadow: 0 1px 2px rgba(0,0,0,.95);
  }
  .estrela.fav { color: rgb(255,210,60); }
  .acoes {
    position: absolute; left: 6px; top: 50px;
    display: flex; gap: 4px; width: calc(100% - 12px);
  }
  .acoes .botao {
    position: static; flex: 1; height: 24px; font-size: 11px;
    background: transparent;
  }
  .acoes .btn-tp { border-color: rgba(255, 255, 255, 0.45); color: #fff; }
  .acoes .btn-spec { border-color: rgba(255, 255, 255, 0.45); }
  .acoes .btn-seguir { border-color: rgba(255, 255, 255, 0.45); }
  .acoes .btn-seguir.seguindo {
    color: #5aff96 !important;
    border-color: rgba(90, 255, 150, 0.85) !important;
  }

  /* dica rodapé */
  #dica {
    position: absolute; right: 16px; bottom: 14px;
    font-size: 11px; color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<button id="toggle">📍</button>

<div id="painel" class="aberto">
  <div id="fundoPainel"></div>
  <div id="sombraFundo"></div>
  <div id="arraste"></div>
  <div id="titulo"><img id="logoCabecalho" alt="DEMONIAKA"></div>
  <button id="minimizar" title="Minimizar">-</button>
  <button id="fechar" title="Fechar">X</button>

  <!-- linha 1: Noclip / ESP / Anti-Cair -->
  <button class="botao toolbar b1" id="noclip">Noclip: OFF</button>
  <button class="botao toolbar b2" id="esp">ESP: OFF</button>
  <button class="botao toolbar b3" id="antiCair">Anti-Cair: OFF</button>

  <!-- linha 2: Salvar / Retornar -->
  <button class="botao locais esq" id="salvar">Salvar Local</button>
  <button class="botao locais dir" id="retornar">Retornar</button>

  <!-- MOVIMENTO -->
  <div id="labelMov">MOVIMENTO</div>

  <div class="linhaMov" style="top:134px">
    <span class="lbl">Velocidade</span>
    <button class="btnMax" data-alvo="speed" data-dir="max">Max</button>
    <button class="btnNormal" data-alvo="speed" data-dir="normal">Normal</button>
    <button class="btnMenos" data-alvo="speed" data-dir="-">-</button>
    <span class="valor" id="vSpeed">16</span>
    <button class="btnMais" data-alvo="speed" data-dir="+">+</button>
  </div>

  <div class="linhaMov" style="top:164px">
    <span class="lbl">Salto</span>
    <button class="btnMax" data-alvo="jump" data-dir="max">Max</button>
    <button class="btnNormal" data-alvo="jump" data-dir="normal">Normal</button>
    <button class="btnMenos" data-alvo="jump" data-dir="-">-</button>
    <span class="valor" id="vJump">50</span>
    <button class="btnMais" data-alvo="jump" data-dir="+">+</button>
  </div>

  <div class="linhaMov" style="top:194px">
    <span class="lbl">Voar</span>
    <button id="flyToggle">OFF</button>
    <button class="btnMax" data-alvo="fly" data-dir="max">Max</button>
    <button class="btnNormal" data-alvo="fly" data-dir="normal">Normal</button>
    <button class="btnMenos" data-alvo="fly" data-dir="-">-</button>
    <span class="valor" id="vFly">50</span>
    <button class="btnMais" data-alvo="fly" data-dir="+">+</button>
  </div>

  <!-- busca -->
  <input id="busca" placeholder="Pesquisar jogador...">

  <!-- barra espectando agora -->
  <div id="barraEspectando">
    <div id="statusDot"></div>
    <span id="labelEspectando">Espectando: -</span>
    <button id="btnPararSpec">Parar</button>
  </div>

  <!-- lista -->
  <div id="lista"></div>
</div>

<div id="dica">Pressione <b>B</b> para abrir/fechar | <b>F</b> para voar | Arraste pelo topo</div>

<script>
  const IMAGEM_BOTAO_URL = "icone-botao-tp.jpg";
  const IMAGEM_FUNDO_URL = "fundo-painel.jpg";
  const IMAGEM_LOGO_URL  = "logo-demoniaka.png";

  const btnFlutuante = document.getElementById('toggle');
  if (IMAGEM_BOTAO_URL) {
    btnFlutuante.style.backgroundImage = 'url("' + IMAGEM_BOTAO_URL + '")';
    btnFlutuante.textContent = '';
  }

  const fundoPainel = document.getElementById('fundoPainel');
  if (IMAGEM_FUNDO_URL) {
    fundoPainel.style.backgroundImage = 'url("' + IMAGEM_FUNDO_URL + '")';
  }

  const logoCabecalho = document.getElementById("logoCabecalho");
  if (IMAGEM_LOGO_URL) { 
    logoCabecalho.src = IMAGEM_LOGO_URL; 
  } else { 
    document.getElementById("titulo").textContent = "Painel do 1hz"; 
  }
  logoCabecalho.title = "Clique para desinjetar o painel";
  logoCabecalho.onclick = function() {
    document.getElementById("painel").classList.remove("aberto");
    document.getElementById("toggle").style.display = "none";
    alert("Painel desinjetado! Recarregue a página para reabrir.");
  };

  // ---------- abrir / fechar / minimizar ----------
  const painel = document.getElementById('painel');
  const toggle = () => painel.classList.toggle('aberto');
  let flutMoveu = false;

  btnFlutuante.onclick = () => {
    if (flutMoveu) { flutMoveu = false; return; }
    toggle();
  };

  document.getElementById('fechar').onclick = () => painel.classList.remove('aberto');

  const btnMinimizar = document.getElementById('minimizar');
  let minimizado = false;
  btnMinimizar.onclick = () => {
    minimizado = !minimizado;
    if (minimizado) {
      painel.classList.add('minimizado');
      btnMinimizar.textContent = '+';
    } else {
      painel.classList.remove('minimizado');
      btnMinimizar.textContent = '-';
    }
  };

  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === 'b') toggle();
    if (k === 'f') alternarFly();
  });

  // ---------- arrastar painel ----------
  let arrastando = false, dx = 0, dy = 0;
  const arraste = document.getElementById('arraste');
  arraste.addEventListener('mousedown', e => {
    arrastando = true;
    const r = painel.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    e.preventDefault();
  });
  addEventListener('mousemove', e => {
    if (!arrastando) return;
    painel.style.left = (e.clientX - dx) + 'px';
    painel.style.top  = (e.clientY - dy) + 'px';
    painel.style.marginTop = '0';
  });
  addEventListener('mouseup', () => arrastando = false);

  // ---------- arrastar bolinha ----------
  let flutArrastando = false;
  let flutInicioX = 0, flutInicioY = 0, flutBaseX = 0, flutBaseY = 0;
  btnFlutuante.addEventListener('mousedown', e => {
    flutArrastando = true; flutMoveu = false;
    flutInicioX = e.clientX; flutInicioY = e.clientY;
    flutBaseX = btnFlutuante.offsetLeft; flutBaseY = btnFlutuante.offsetTop;
    e.preventDefault();
  });
  addEventListener('mousemove', e => {
    if (!flutArrastando) return;
    const fdx = e.clientX - flutInicioX, fdy = e.clientY - flutInicioY;
    if (Math.hypot(fdx, fdy) > 6) flutMoveu = true;
    btnFlutuante.style.left = Math.max(0, Math.min(innerWidth - 50, flutBaseX + fdx)) + 'px';
    btnFlutuante.style.top = Math.max(0, Math.min(innerHeight - 50, flutBaseY + fdy)) + 'px';
    btnFlutuante.style.marginTop = '0';
  });
  addEventListener('mouseup', () => flutArrastando = false);

  // ==========================================
  // NOCLIP / ESP / ANTI-CAIR
  // ==========================================
  const btnNoclip = document.getElementById('noclip');
  btnNoclip.onclick = () => {
    const ligado = btnNoclip.classList.toggle('on');
    btnNoclip.textContent = ligado ? 'Noclip: ON' : 'Noclip: OFF';
  };

  const btnEsp = document.getElementById('esp');
  btnEsp.onclick = () => {
    const ligado = btnEsp.classList.toggle('on');
    btnEsp.textContent = ligado ? 'ESP: ON' : 'ESP: OFF';
  };

  const btnAntiCair = document.getElementById('antiCair');
  btnAntiCair.onclick = () => {
    const ligado = btnAntiCair.classList.toggle('on');
    btnAntiCair.textContent = ligado ? 'Anti-Cair: ON' : 'Anti-Cair: OFF';
  };

  // ==========================================
  // SALVAR / RETORNAR
  // ==========================================
  let localSalvo = false;
  const btnSalvar = document.getElementById('salvar');
  const btnRetornar = document.getElementById('retornar');

  btnSalvar.onclick = () => {
    localSalvo = true;
    btnRetornar.classList.add('azul');
    btnSalvar.textContent = 'Salvo ✓';
    btnSalvar.classList.add('on');
    setTimeout(() => {
      btnSalvar.textContent = 'Salvar Local';
      btnSalvar.classList.remove('on');
    }, 1500);
  };

  btnRetornar.onclick = () => {
    if (!localSalvo) {
      btnRetornar.textContent = 'Nada salvo!';
      btnRetornar.classList.add('vermelho');
      setTimeout(() => {
        btnRetornar.textContent = 'Retornar';
        btnRetornar.classList.remove('vermelho');
      }, 1200);
      return;
    }
    btnRetornar.textContent = 'Voltou ✓';
    setTimeout(() => btnRetornar.textContent = 'Retornar', 900);
  };

  // ==========================================
  // CONTROLES DE MOVIMENTO
  // ==========================================
  const configs = {
    speed: { el: 'vSpeed', nome: 'Velocidade', min: 8,  max: 1000, passo: 20, normal: 16 },
    jump:  { el: 'vJump',  nome: 'Salto',      min: 20, max: 1000, passo: 50, normal: 50 },
    fly:   { el: 'vFly',   nome: 'Voar',       min: 10, max: 1000, passo: 50, normal: 50 },
  };

  document.querySelectorAll('[data-alvo]').forEach(btn => {
    btn.onclick = () => {
      const alvo = btn.dataset.alvo;
      const c = configs[alvo];
      const el = document.getElementById(c.el);
      let v = parseInt(el.textContent, 10);

      if (btn.dataset.dir === 'max') {
        v = c.max;
      } else if (btn.dataset.dir === 'normal') {
        v = c.normal;
      } else if (btn.dataset.dir === '+') {
        v += c.passo;
      } else {
        v -= c.passo;
      }

      el.textContent = Math.max(c.min, Math.min(c.max, v));
    };
  });

  function alternarFly() {
    const btn = document.getElementById('flyToggle');
    const ligado = btn.classList.toggle('on');
    btn.textContent = ligado ? 'ON' : 'OFF';
  }
  document.getElementById('flyToggle').onclick = alternarFly;

  // ==========================================
  // BARRA DE ESPECTADOR (PARAR)
  // ==========================================
  const barraEspectando = document.getElementById('barraEspectando');
  const labelEspectando = document.getElementById('labelEspectando');
  const btnPararSpec = document.getElementById('btnPararSpec');
  const listaEl = document.getElementById('lista');

  btnPararSpec.onclick = () => {
    barraEspectando.classList.remove('visivel');
    listaEl.style.top = '266px';
    listaEl.style.height = '252px';
  };

  function iniciarEspectar(nome) {
    labelEspectando.textContent = 'Espectando: ' + nome;
    barraEspectando.classList.add('visivel');
    listaEl.style.top = '300px';
    listaEl.style.height = '218px';
  }

  // ==========================================
  // LISTA DE JOGADORES (TP, SPEC, SEGUIR, FAVORITO)
  // ==========================================
  const jogadores = [
    { nome: '6yelt',     disp: '6yelt',     fav: true,  avatar: 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-FB7D9B4A0B7955BFA8E079D1ED86F46A-Png/150/150/AvatarHeadshot/Png/noFilter' },
    { nome: '75ef',      disp: '75ef',      fav: true,  avatar: 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-8D99214717C9B100F837269D3B6204C3-Png/150/150/AvatarHeadshot/Png/noFilter' },
    { nome: 'Aircale',   disp: 'Aircale',   fav: false, avatar: 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-9102A889417937A208D1E3A526019A81-Png/150/150/AvatarHeadshot/Png/noFilter' },
    { nome: 'Vampire99', disp: 'Vampire',   fav: false, avatar: '' },
    { nome: 'GothicGirl',disp: 'Gothic',    fav: false, avatar: '' },
  ];

  let seguindoAtual = null;

  function pintar(filtro = '') {
    listaEl.innerHTML = '';
    const f = filtro.toLowerCase();
    const visiveis = jogadores
      .filter(j => !f || j.nome.toLowerCase().includes(f) || j.disp.toLowerCase().includes(f))
      .sort((a, b) => (b.fav - a.fav) || a.nome.localeCompare(b.nome));

    for (const j of visiveis) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.nome = j.nome;
      
      const fotoHtml = j.avatar 
        ? '<img src="' + j.avatar + '" alt="' + j.nome + '" onerror="this.parentElement.textContent=\'' + j.disp[0].toUpperCase() + '\'">' 
        : j.disp[0].toUpperCase();

      const seguindoEsse = (seguindoAtual === j.nome);

      card.innerHTML = `
        <div class="foto">${fotoHtml}</div>
        <div class="nome">${j.nome}</div>
        <button class="estrela ${j.fav ? 'fav' : ''}">${j.fav ? '★' : '☆'}</button>
        <div class="acoes">
          <button class="botao btn-tp">TP</button>
          <button class="botao btn-spec">Spec</button>
          <button class="botao btn-seguir ${seguindoEsse ? 'seguindo' : ''}">${seguindoEsse ? 'Seguindo' : 'Seguir'}</button>
        </div>`;

      // Estrela de favorito
      const btnEstrela = card.querySelector('.estrela');
      btnEstrela.onclick = (e) => {
        e.stopPropagation();
        j.fav = !j.fav;
        pintar(document.getElementById('busca').value);
      };

      // Teleporte
      const btnTp = card.querySelector('.btn-tp');
      btnTp.onclick = () => {
        btnTp.textContent = 'Teleportado!';
        setTimeout(() => btnTp.textContent = 'TP', 900);
      };

      // Spec
      const btnSpec = card.querySelector('.btn-spec');
      btnSpec.onclick = () => {
        iniciarEspectar(j.nome);
      };

      // Seguir
      const btnSeguir = card.querySelector('.btn-seguir');
      btnSeguir.onclick = () => {
        if (seguindoAtual === j.nome) {
          seguindoAtual = null;
        } else {
          seguindoAtual = j.nome;
        }
        pintar(document.getElementById('busca').value);
      };

      listaEl.appendChild(card);
    }
  }

  document.getElementById('busca').oninput = (e) => pintar(e.target.value);
  pintar();
</script>
</body>
</html>
